[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent8088"
version = "0.1.0"
description = "Agent8088 - Local AI Assistant"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
]

[project.scripts]
agent8088 = "agent8088.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent8088"]
