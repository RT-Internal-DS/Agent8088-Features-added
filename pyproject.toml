[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent8088"
version = "0.2.0"
description = "Agent8088 - Local AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<3",
    "rich>=13.0.0,<16",
    "InquirerPy>=0.3.4,<1",
    "mcp>=1.27,<2",
    "Pillow>=9,<13",
    "playwright>=1.40,<2",
    # Keyless web search fallback. A hard dependency on purpose: web_search must
    # always have a backend that needs no Docker, no API key, and no setup step,
    # so a stopped or unreachable SearXNG still returns results instead of an
    # error. Reached only through web_search.DdgsProvider, which enforces the
    # egress policy on its fixed upstream hosts before the library runs.
    "ddgs>=9,<10",
    # Both of these are imported directly by cli.py and were reaching the
    # install only as transitive dependencies -- prompt_toolkit via InquirerPy,
    # Pygments via rich. That works until an upstream drops or re-bounds them,
    # and the failure is silent rather than loud: both call sites fall back on
    # ImportError, so Tab completion would quietly disappear and every syntax
    # theme would quietly validate as invalid. Depend on what you import.
    "prompt_toolkit>=3.0.1,<4",
    "Pygments>=2.13,<3",
]

[project.optional-dependencies]
gateway = ["slack-bolt>=1.18.0,<2", "slack-sdk>=3.23.0,<4", "httpx>=0.24.0,<1", "discord.py>=2.3.0,<3", "python-telegram-bot>=20,<23"]
dev = ["pytest>=7.0.0,<10", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]
# Only needed for a provider profile with api_mode=litellm. Kept out of the base
# install because it is a large dependency serving one optional backend, but
# declared so `pip install agent8088[litellm]` works instead of leaving the user
# to discover the package name from a runtime error.
litellm = ["litellm>=1,<2"]

[project.scripts]
agent8088 = "agent8088.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent8088"]

[tool.hatch.build.targets.wheel.force-include]
"assets/palindrome-research-labs.png" = "agent8088/assets/palindrome-research-labs.png"
"assets/palindrome-research-labs.ansi" = "agent8088/assets/palindrome-research-labs.ansi"
"src/agent8088/gateway/platforms/whatsapp_bridge/bridge.js" = "agent8088/gateway/platforms/whatsapp_bridge/bridge.js"
"src/agent8088/gateway/platforms/whatsapp_bridge/package.json" = "agent8088/gateway/platforms/whatsapp_bridge/package.json"
"src/agent8088/gateway/platforms/whatsapp_bridge/package-lock.json" = "agent8088/gateway/platforms/whatsapp_bridge/package-lock.json"
