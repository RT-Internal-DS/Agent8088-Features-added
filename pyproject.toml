[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent8088"
version = "0.2.0"
description = "Agent8088 - Local AI Assistant"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "InquirerPy>=0.3.4",
]

[project.optional-dependencies]
search = ["requests>=2.31.0"]
training = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "peft>=0.5.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
]

[project.scripts]
agent8088 = "agent8088.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent8088"]
