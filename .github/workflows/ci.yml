name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (incl. gateway extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gateway,dev]"

      - name: Check for duplicate top-level definitions
        run: python scripts/check_duplicate_defs.py

      - name: Run unit tests
        run: AGENT8088_CONFIG=/nonexistent python -m pytest tests/ -v

      - name: Run functional verification
        run: |
          VERIFY_HOME="$(mktemp -d)"
          AGENT8088_CONFIG=/nonexistent AGENT8088_HOME="$VERIFY_HOME" \
            python scripts/verify_features.py
          rm -rf -- "$VERIFY_HOME"
